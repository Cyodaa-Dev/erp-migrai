[project]
name = "erp-migrai"
version = "0.0.1"
description = "鼎新 T100（Genero 4GL）遷移至 Odoo 17 CE 的開源核心工具"
readme = "README.md"
requires-python = ">=3.12"
# PEP 639：license 用 SPDX 運算式，license-files 指定要隨散布附上的授權文字。
# Apache-2.0 §4(a) 要求散布時附上授權副本——只在 metadata 宣告授權而不附全文是不夠的。
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "lark>=1.3.1",
    "typer>=0.27.1",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.2",
]

[project.urls]
Homepage = "https://github.com/Cyodaa-Dev/erp-migrai"
Repository = "https://github.com/Cyodaa-Dev/erp-migrai"

[project.scripts]
migrai = "erp_migrai.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erp_migrai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 需要 docker Odoo 的整合測試（make test 預設跳過）",
]
addopts = "-m 'not integration'"
