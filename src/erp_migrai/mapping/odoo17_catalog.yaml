# ============================================================================
# Odoo 17 目標欄位 catalog
# ============================================================================
#
# 誠實性聲明（請先讀完再使用這份檔案）：
#
# 這份 catalog 是**人工整理**的結果——由維護者閱讀 Odoo 17 Community Edition
# 的官方文件與原始碼（odoo/odoo，17.0 分支）逐一核對後手寫下來，**不是**從一台
# 正在跑的 Odoo 17 實例反射（introspect）出來的。這代表它可能有錯：欄位型別
# 記錯、欄位其實不存在、或者欄位存在但所屬模組記錯，都有可能發生。
#
# 目標版本／版別：Odoo 17.0，Community Edition（CE）。這份 catalog 完全沒有
# 涵蓋 Enterprise-only 的模型或欄位。
#
# 如果你手上有一台真正的 Odoo 17，發現這裡的記載與實際情況不符——型別不對、
# 欄位根本不存在、或欄位存在但 module 掛錯——那是一個值得回報的臭蟲，不是你
# 用錯了。請開 parser-gap-report issue（與 4GL parser 回報解析落差用同一個
# 管道），註明是哪個模型、哪個欄位、你看到的實際情況。
#
# 為什麼每個欄位都要記 `module`：Odoo 的欄位不是全部在核心模組（base）裡就
# 一次到位，一個欄位存在與否，取決於它所屬的模組有沒有被安裝。最具體的例子
# 就是 `res.partner.credit_limit`——這個欄位是 `account` 模組安裝後才會出現
# 在 `res.partner` 上的，一個乾淨的 Odoo（沒裝 account）上完全沒有這個欄位。
# 如果這裡把它的 module 錯記成 `base`，`load` 階段寫入時會在一台沒裝 account
# 的 Odoo 上失敗，而且失敗訊息不會告訴你「因為 module 沒裝」——這正是這份
# catalog 存在的意義：讓這類落差在 `map` 階段就能被看見、被解釋，而不是留到
# `load` 階段才用一個看不懂的錯誤炸出來。
#
# 內容範圍：只涵蓋 spec §2.5 三個 MVP 資料切片對應的模型（res.partner、
# product.template、sale.order），外加 sale.order.line——因為 sale.order
# 是「單頭 + 明細行」的形狀，沒有明細行模型，訂單映射就是不完整的。欄位也只收
# MVP 用得到的，不是這幾個模型在 Odoo 裡的全部欄位。
#
# ----------------------------------------------------------------------------
#
# 已對照原始碼核實（而非僅憑文件或印象）：
#
# 「人工整理」這四個字誠實，但無從證偽——沒有人知道維護者到底核對過什麼、
# 沒核對過什麼。以下四筆是實際打開 odoo/odoo 17.0 分支原始碼、逐行核對過的，
# 具體到檔案與行號；沒有列在這裡的欄位，代表它們的記載仍然只是依據文件與
# 記憶整理，尚未逐行對照原始碼——這不代表它們是錯的，只是誠實標示「這裡的
# 確定程度比較低」，而不是讓整份檔案的可信度看起來一樣齊頭平等。
#
#   1. res.partner.customer_rank 的 module 是 account，不是 base：
#      https://raw.githubusercontent.com/odoo/odoo/17.0/addons/account/models/partner.py
#      第 606 行：`customer_rank = fields.Integer(default=0, copy=False)`；
#      該檔案第 336 行 `_inherit = 'res.partner'`，證實這是 account 模組
#      掛到 res.partner 上的欄位。
#   2. res.partner.supplier_rank 的 module 同上，也是 account，不是 base：
#      https://raw.githubusercontent.com/odoo/odoo/17.0/addons/account/models/partner.py
#      第 605 行：`supplier_rank = fields.Integer(default=0, copy=False)`。
#   3. res.partner.credit_limit 的型別確認是 float、module 確認是 account：
#      https://raw.githubusercontent.com/odoo/odoo/17.0/addons/account/models/partner.py
#      第 543 行：`credit_limit = fields.Float(...)`。
#   4. product.template.weight 與 product.template.volume 的型別確認都是
#      float、module 確認是 product：
#      https://raw.githubusercontent.com/odoo/odoo/17.0/addons/product/models/product_template.py
#      第 84 行（weight）與第 87 行（volume），皆為 `fields.Float(...)`。
#   5. product.product 的六個欄位，2026-07-29 逐行核對
#      addons/product/models/product_product.py 與
#      addons/product/models/product_template.py（17.0 分支）：
#      https://raw.githubusercontent.com/odoo/odoo/17.0/addons/product/models/product_product.py
#      https://raw.githubusercontent.com/odoo/odoo/17.0/addons/product/models/product_template.py
#        - name：委派自 product.template，product_template.py 第 40 行
#          `name = fields.Char('Name', index='trigram', required=True, translate=True)`；
#          required=True。
#        - list_price：委派自 product.template，product_template.py 第 71 行
#          `list_price = fields.Float('Sales Price', default=1.0, digits='Product Price', ...)`；
#          非 required。
#        - default_code：product_product.py 第 34 行
#          `default_code = fields.Char('Internal Reference', index=True)`；非 required。
#        - barcode：product_product.py 第 44 行
#          `barcode = fields.Char('Barcode', copy=False, index='btree_not_null', ...)`；
#          非 required。
#        - standard_price：product_product.py 第 53 行
#          `standard_price = fields.Float('Cost', company_dependent=True, digits='Product Price',
#          groups="base.group_user", ...)`；非 required。
#        - active：product_product.py 第 38 行
#          `active = fields.Boolean('Active', default=True, ...)`；非 required。
#
#      兩個必須知道的陷阱：
#        (a) product.product 是**委派繼承**：product_product.py 第 18 行
#            `_inherits = {'product.template': 'product_tmpl_id'}`。所以 name 與
#            list_price 不是 product.product 自己宣告的欄位，而是透過委派寫進
#            product.template；寫得進去，但寫入機制與 product.product 自身欄位
#            不同（詳見下方 product.product 模型 name／list_price 欄位的 help）。
#        (b) product.product 自己另外有一個 `lst_price`（product_product.py 第
#            29 行，compute + inverse）——**不要用它**，要用委派來的 `list_price`。
#            兩者很容易挑錯，這裡刻意記下來避免下一個人踩到。
#
# ----------------------------------------------------------------------------
#
# `required` 的語意（釘死，避免每次寫欄位時各自解讀）：
#
# `required: true` 代表「不提供這個欄位就無法成功建立記錄」，不論這個限制來自
# `fields.required=True`、SQL constraint、或 `@api.constrains`。選這個語意是
# 因為 catalog 的消費者是載入階段，它關心的是「不填會不會失敗」，而不是 Odoo
# 內部用哪種機制表達這件事。
#
# 依此語意：res.partner.name 標 `required: true` 是**正確的**（欄位本身不
# required，但 `check_name` 這條 SQL constraint 讓 contact 型別實質必填，見
# `odoo/addons/base/models/res_partner.py` 第 209、304 行）。
#
# ----------------------------------------------------------------------------
models:
  res.partner:
    description: >-
      聯絡人／夥伴（客戶、供應商、或兩者皆是）。T100 的客戶主檔、供應商主檔
      在 Odoo 裡統一對應到這一個模型，用 customer_rank／supplier_rank 與
      is_company 區分角色與型態。
    fields:
      name:
        type: char
        required: true
        module: base
        help: "夥伴名稱（公司名稱或個人姓名）。"
      ref:
        type: char
        required: false
        module: base
        help: "內部參照代碼，通常用來放來源系統（T100）的原始編號以利追溯。"
      vat:
        type: char
        required: false
        module: base
        help: "統一編號／稅籍編號。"
      phone:
        type: char
        required: false
        module: base
        help: "市話電話號碼。"
      mobile:
        type: char
        required: false
        module: base
        help: "行動電話號碼。"
      email:
        type: char
        required: false
        module: base
        help: "電子郵件地址。"
      street:
        type: char
        required: false
        module: base
        help: "地址第一行（street）。"
      street2:
        type: char
        required: false
        module: base
        help: "地址第二行（street2），補充用，例如樓層、巷弄。"
      city:
        type: char
        required: false
        module: base
        help: "城市。"
      zip:
        type: char
        required: false
        module: base
        help: "郵遞區號。"
      active:
        type: boolean
        required: false
        module: base
        help: "是否為有效（未封存）的夥伴；封存的夥伴預設不會出現在大多數畫面上。"
      comment:
        type: text
        required: false
        module: base
        help: "自由格式的備註內文。"
      credit_limit:
        type: float
        required: false
        module: account
        help: >-
          信用額度上限。只有安裝 account 模組後 res.partner 才會有這個欄位，
          一個沒裝 account 的 Odoo 上不存在。
      is_company:
        type: boolean
        required: false
        module: base
        help: "true 表示這是公司（組織），false 表示這是個人聯絡人。"
      customer_rank:
        type: integer
        required: false
        module: account
        help: >-
          客戶身分的強度分數，數值越高代表越常被當成銷售對象；大於 0 通常
          代表這是一個客戶。這個欄位是 account 模組加到 res.partner 上的，
          不是 base 就有的（見檔頭「已對照原始碼核實」一節）。
      supplier_rank:
        type: integer
        required: false
        module: account
        help: >-
          供應商身分的強度分數，數值越高代表越常被當成採購對象；大於 0
          通常代表這是一個供應商。這個欄位是 account 模組加到 res.partner
          上的，不是 base 就有的（見檔頭「已對照原始碼核實」一節）。

  product.template:
    description: >-
      產品（樣板層級，不分變體）。T100 的品號主檔對應到這個模型；若品號沒有
      規格變體（no variant），product.template 與 product.product 是一對一的。
    fields:
      name:
        type: char
        required: true
        module: product
        help: "產品名稱。"
      default_code:
        type: char
        required: false
        module: product
        help: "內部品號／料號，通常放來源系統（T100）的原始品號。"
      barcode:
        type: char
        required: false
        module: product
        help: "條碼（EAN/UPC 等）。"
      list_price:
        type: float
        required: false
        module: product
        help: "建議售價（銷售基準價）。"
      standard_price:
        type: float
        required: false
        module: product
        help: "成本價（用於毛利計算等內部用途）。"
      uom_id:
        type: many2one
        required: false
        module: product
        help: "銷售／庫存計量單位，指向 uom.uom。"
      uom_po_id:
        type: many2one
        required: false
        module: product
        help: "採購計量單位，指向 uom.uom；可能與 uom_id 不同（例如採購以箱、銷售以個）。"
      type:
        type: selection
        required: false
        module: product
        help: >-
          產品型態（例如服務、消耗品等）；決定是否追蹤庫存與相關的可選欄位
          會不會出現。
      active:
        type: boolean
        required: false
        module: product
        help: "是否為有效（未封存）的產品。"
      description:
        type: text
        required: false
        module: product
        help: "內部說明備註（非對客戶顯示的銷售說明）。"
      weight:
        type: float
        required: false
        module: product
        help: "單位重量，用於物流／運費估算。"
      volume:
        type: float
        required: false
        module: product
        help: "單位體積，用於物流／運費估算。"

  product.product:
    description: >-
      產品變體（variant）。sale.order.line.product_id 指向的是這個模型，不是
      product.template。直接建立 product.product 時 Odoo 會自動補上對應的
      product.template，因此來源系統的品號主檔對到這裡，可以避免載入階段必須
      內建「建完 template 要讀回 product_variant_id」這種 Odoo 特定模型的內部知識。
    fields:
      name:
        type: char
        required: true
        module: product
        help: >-
          產品名稱。委派自 product.template（`_inherits = {'product.template':
          'product_tmpl_id'}`，product_product.py 第 18 行）：這個欄位不是
          product.product 自己宣告的，是透過委派寫進 product.template（見
          product_template.py 第 40 行，required=True）。委派欄位寫得進去，
          但實際存放位置是 product.template，不是 product.product 自身。
      default_code:
        type: char
        required: false
        module: product
        help: "內部品號／料號，通常放來源系統（T100）的原始品號。product_product.py 第 34 行。"
      barcode:
        type: char
        required: false
        module: product
        help: "條碼（EAN/UPC 等）。product_product.py 第 44 行。"
      list_price:
        type: float
        required: false
        module: product
        help: >-
          建議售價（銷售基準價）。與 name 一樣是委派自 product.template 的欄位
          （product_template.py 第 71 行，非 required），不是 product.product
          自己宣告的欄位。**不要跟 product.product 自己的 lst_price
          （product_product.py 第 29 行，compute + inverse）搞混**——lst_price
          是另一個唯讀計算欄位，不是這個欄位，寫入時不能用它取代 list_price。
      standard_price:
        type: float
        required: false
        module: product
        help: >-
          成本價。product_product.py 第 53 行：`company_dependent=True`（值實際
          存在 ir.property，不是一般欄位）且 `groups="base.group_user"`
          （需要對應的存取群組才讀寫得到）。透過匯入寫入時的實際行為
          （是否需要額外處理 company_dependent 儲存方式）待 CI 實測確認。
      active:
        type: boolean
        required: false
        module: product
        help: "是否為有效（未封存）的產品。product_product.py 第 38 行。"

  sale.order:
    description: >-
      銷售訂單單頭。T100 的銷貨訂單主檔對應到這個模型，明細行在
      sale.order.line。
    fields:
      name:
        type: char
        required: true
        module: sale
        help: "訂單編號（Odoo 內部單號，通常自動編號）。"
      partner_id:
        type: many2one
        required: true
        module: sale
        help: "下單客戶，指向 res.partner。"
      date_order:
        type: datetime
        required: false
        module: sale
        help: "訂單建立／確認的日期時間。"
      state:
        type: selection
        required: false
        module: sale
        help: "訂單狀態（例如草稿、已確認、已取消）。"
      amount_total:
        type: monetary
        required: false
        module: sale
        help: "訂單含稅總金額。"
      client_order_ref:
        type: char
        required: false
        module: sale
        help: "客戶自己的訂單編號（客戶端參照），用於單據對帳。"
      note:
        type: text
        required: false
        module: sale
        help: "訂單備註。"

  sale.order.line:
    description: "銷售訂單明細行，隸屬於某一張 sale.order。"
    fields:
      order_id:
        type: many2one
        required: true
        module: sale
        help: "所屬的銷售訂單，指向 sale.order。"
      product_id:
        type: many2one
        required: false
        module: sale
        help: >-
          此明細行的產品，指向 product.product。Odoo 17.0 的欄位定義未標
          required（sale_order_line.py 第 80～84 行）；是否真的可以省略，
          待 CI 實測確認。
      name:
        type: text
        required: true
        module: sale
        help: "此明細行顯示的說明文字（通常預設帶入產品名稱，可人工覆寫）。"
      product_uom_qty:
        type: float
        required: true
        module: sale
        help: >-
          訂購數量（以 product_uom_id 為單位）。sale_order_line.py 第
          115～119 行：`compute + precompute + default=1.0` 的 required 欄位。
      price_unit:
        type: float
        required: false
        module: sale
        help: "單價。"
      discount:
        type: float
        required: false
        module: sale
        help: "折扣百分比。"
      price_subtotal:
        type: monetary
        required: false
        module: sale
        help: "此明細行未稅小計金額。"
