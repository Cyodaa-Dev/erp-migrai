# 映射規則：T100 銷售訂單（單頭 ord_mast + 明細 ord_deta）與品號主檔
# prod_mast → Odoo sale.order / sale.order.line / product.product
#
# 【貢獻點③】跟 res_partner.yaml 一樣，這是人類知識，不需要改任何 Python。
#
# cust_mast → res.partner 已經在 res_partner.yaml 宣告過，這裡刻意不重複
# 宣告（見 rules/README.md：重複且不矛盾雖然會被靜默保留，但兩份檔案講
# 同一件事，等於留了一個「改一邊忘另一邊」的地雷）。
#
# 兩條 reference 分別演練兩種真實 T100 常見的外鍵形狀：
#   - ord_mast.ord_cust_no：DDL 有宣告 FOREIGN KEY（schema.sql），規則宣告
#     的 ref_table／ref_column 與 DDL 一致，不會觸發 E-2001。
#   - ord_deta.ord_prod_no：DDL 刻意沒有宣告 FK（schema.sql 的註解說明），
#     只能靠這裡的規則補上——這是真實 T100 更常見的形狀：代碼式表名、
#     參照關係只存在於程式邏輯與人的知識裡。
version: 1

tables:
  prod_mast:
    target_model: product.product
  ord_mast:
    target_model: sale.order
  ord_deta:
    target_model: sale.order.line

columns:
  # --- prod_mast → product.product -----------------------------------------
  prod_mast.prod_no:
    target: product.product.default_code
  prod_mast.prod_name:
    target: product.product.name
  prod_mast.prod_price:
    target: product.product.list_price
  prod_mast.prod_cost:
    target: product.product.standard_price
  # T100 用 CHAR(1) 的 Y/N 表示品號是否啟用，Odoo 的 active 是 boolean，
  # 跟 res_partner.yaml#cust_mast.cust_stus 同一個理由，需要值轉換。
  prod_mast.prod_stus:
    target: product.product.active
    transform:
      kind: value_map
      map:
        "Y": true
        "N": false
      default: true
  # prod_mast.prod_spec（規格說明）刻意不在這裡宣告規則：product.product
  # 這份 catalog 收錄的欄位裡沒有適合承接自由格式規格文字的欄位（name 是
  # 品名、沒有獨立的 description／規格欄位）。名稱與型別啟發式對它算出的
  # 分數也是 0（正規化後與 catalog 任何欄位都沒有交集），所以它會落進
  # mapping.json 的 unmapped，理由是「catalog 中找不到型別相容且名稱相近
  # 的欄位」——這是誠實的「目前沒有地方放」，不是遺漏。

  # --- ord_mast → sale.order -------------------------------------------------
  # Task 4.5（昴君裁決）修正：map 階段新增的目標欄位唯一性檢查一上線，就在
  # 我們自己的語料裡抓到一個真缺陷——ord_no（規則，confidence 100）與
  # ord_cust_ref（啟發式，confidence 30）同時對到 client_order_ref，兩者
  # 語意上不該共用同一個欄位：
  #   - ord_cust_ref 是「客戶自己的訂單編號」，正是 catalog 對
  #     client_order_ref 的定義（客戶端參照，用於單據對帳）——這才是它
  #     該去的地方。
  #   - ord_no 是 T100 自己（我們這邊）的訂單編號，語意上更接近
  #     sale.order.name（訂單編號），佔用 client_order_ref 是配錯了。
  # 下面把兩條規則都改正：ord_cust_ref 明確對到 client_order_ref，
  # ord_no 明確對到 name。
  #
  # sale.order.name 是 required=True 且有 default=lambda self: _('New')
  # （Odoo 內建自動編號機制，Odoo 17 原始碼
  # addons/sale/models/sale_order.py 第 51～55 行）。已對同一份原始碼的
  # create() 核對（第 814～825 行）：序號只在
  # `vals.get('name', _("New")) == _("New")` 時才套用，也就是只有 name
  # 缺失、或值剛好等於當前語系的 _("New") 翻譯字串時才會被覆寫。明確傳入
  # 的 ord_no 會被完整保留。
  #
  # 殘留的窄邊界：某筆 ord_no 的值剛好等於 _("New") 的翻譯字串時，那一筆
  # 會被序號蓋掉。即使發生，ord_no 的可追溯性也不會遺失——ord_no 是
  # ord_mast 的主鍵，載入階段會用它組成 external_id
  # （`migrai.<source_id>.ord_mast.<ord_no>`），原始單號永遠可以透過那個
  # external_id 追溯回去，不依賴 name 欄位是否保留原值。
  ord_mast.ord_no:
    target: sale.order.name
  ord_mast.ord_cust_ref:
    target: sale.order.client_order_ref
  ord_mast.ord_cust_no:
    target: sale.order.partner_id
    transform:
      kind: reference
      ref_table: cust_mast
      ref_column: cust_no
  ord_mast.ord_date:
    target: sale.order.date_order
  ord_mast.ord_memo:
    target: sale.order.note

  # --- ord_deta → sale.order.line --------------------------------------------
  # 🔴 這條沒有第二個選項：DDL 有宣告 ord_deta.ord_no 的外鍵（指向
  # ord_mast.ord_no），但「從 DDL 外鍵自動產生 reference」已被證實是永遠
  # 打不開的死碼並整段拿掉（見 mapping/engine.py 模組層級註解），所以
  # one2many 分組必須的 order_id 一樣要靠規則明確宣告。
  ord_deta.ord_no:
    target: sale.order.line.order_id
    transform:
      kind: reference
      ref_table: ord_mast
      ref_column: ord_no
  # ord_deta.ord_prod_no：DDL 刻意沒有宣告 FK（見 schema.sql 註解），
  # 只能靠這條規則宣告 reference。
  ord_deta.ord_prod_no:
    target: sale.order.line.product_id
    transform:
      kind: reference
      ref_table: prod_mast
      ref_column: prod_no
  ord_deta.ord_desc:
    target: sale.order.line.name
  ord_deta.ord_qty:
    target: sale.order.line.product_uom_qty
  ord_deta.ord_price:
    target: sale.order.line.price_unit
  # ord_deta.ord_seq（明細行序號）刻意不在這裡宣告規則：這份 catalog 裡
  # sale.order.line 沒有序號欄位，名稱／型別啟發式對它算出的分數也是 0
  # （唯一有字面交集的欄位 order_id 是 many2one，型別分數恆為 0），會落進
  # unmapped，理由同樣是「找不到型別相容且名稱相近的欄位」。
