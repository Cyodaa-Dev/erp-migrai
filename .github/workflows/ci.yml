# CI：lint／test／build／dco 四個獨立 job。
#
# 指令選擇原則：`lint` 與 `test` job 呼叫的是 `make lint`／`make test`，
# 不是拆開寫的 `uv run ruff …`／`uv run pytest …`——CONTRIBUTING.md 已經
# 承諾「送 PR 前確認 make lint 與 make test 都是綠的；CI 設定完成後會用
# 同一組指令驗證」，指令一旦分岔，那句承諾就變成假的。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 只保留每個 ref 上最新的一次 run：PR 連續推送時，被取代的 run 沒有必要
# 跑到完，白燒 runner 分鐘數。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小權限：四個 job 都只需要 checkout 原始碼，不需要寫入 repo 或呼叫其他
# API。repo／org 層級的預設值可能比這寬，這裡明確釘住，不依賴 UI 設定。
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v7

      - name: 安裝 uv（含快取）
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: 安裝開發環境
        run: uv sync --locked

      - name: make lint（ruff check + ruff format --check）
        run: make lint

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.12 是 pyproject.toml 宣告的下限；3.13 用來提早抓向前相容問題。
        python-version: ["3.12", "3.13"]
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v7

      - name: 安裝 uv（含快取，並指定 Python 版本）
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: 安裝開發環境
        run: uv sync --locked

      - name: make test（單元 + golden，跳過 integration marker）
        run: make test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v7

      - name: 安裝 uv（含快取）
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: 建置 wheel 與 sdist
        run: uv build -o dist

      # pytest 碰不到這種缺陷：資料檔（YAML/JSON/README）沒被打包進 wheel，
      # 本機單元測試全綠，但 `pip install` 之後執行期才會找不到檔案而炸掉。
      # 因此直接對建出來的 wheel 用 zipfile 讀內容來斷言——本機沒有 unzip。
      # `--no-project` 讓這段只用標準函式庫（glob／zipfile），不觸發專案的
      # 相依解析：這樣「相依解析失敗」與「wheel 內容斷言失敗」是兩種不同的
      # 紅燈，不會把前者誤判成後者。
      - name: 驗證 wheel 內容含資料檔與授權檔
        run: |
          uv run --no-project python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert wheels, "找不到任何 .whl 檔"
          names = zipfile.ZipFile(wheels[0]).namelist()

          required = [
              "erp_migrai/mapping/odoo17_catalog.yaml",
              "erp_migrai/mapping/rules/res_partner.yaml",
              "erp_migrai/mapping/rules/README.md",
              "erp_migrai/mapping/schema/mapping.schema.json",
              "erp_migrai/pipeline/schema/migration_log.schema.json",
              "erp_migrai/pipeline/schema/verification_report.schema.json",
          ]
          missing = [r for r in required if r not in names]
          assert not missing, f"wheel 缺少：{missing}"

          # 授權檔路徑含版本號（例如 erp_migrai-0.0.1.dist-info/...），
          # 版本一升路徑就變，因此用結尾比對而非寫死完整路徑。
          assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), (
              "wheel 缺少 LICENSE（應在 *.dist-info/licenses/ 底下）"
          )
          assert any(n.endswith(".dist-info/licenses/NOTICE") for n in names), (
              "wheel 缺少 NOTICE（應在 *.dist-info/licenses/ 底下，"
              "Apache-2.0 §4(d) 要求再散布時附上）"
          )

          print("wheel 內容確認 OK")
          PY

      # sdist 打包的是「進 git 的檔案」，跟 wheel 是完全不同的打包路徑，
      # 上面驗 wheel 內容的斷言完全罩不到它。hatchling 組 sdist 時讀的是
      # repo 根目錄的 `.gitignore`：任何沒被那份 `.gitignore` 擋掉的本機
      # 檔案（例如 agent 工具的本機設定）都會原封不動地跟著 sdist 出貨、
      # 上 PyPI。這裡直接對建出來的 sdist 用 tarfile 讀內容來斷言。
      - name: 驗證 sdist 不含不該出貨的路徑
        run: |
          uv run --no-project python - <<'PY'
          import glob
          import tarfile

          sdists = glob.glob("dist/*.tar.gz")
          assert sdists, "找不到任何 .tar.gz"
          names = tarfile.open(sdists[0]).getnames()

          forbidden_substrings = [".claude/", "_local/", "/out/", ".superpowers/", "data.sqlite"]
          offenders = [n for n in names if any(f in n for f in forbidden_substrings)]
          assert not offenders, f"sdist 含有不該出貨的路徑：{offenders}"

          print(f"sdist 內容確認 OK（{len(names)} 個項目，無不該出貨的路徑）")
          PY

  dco:
    name: dco
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 只在 pull_request 情境執行。DCO 的把關點是「合併前」：PR 上的這個 job
    # 已經涵蓋這個 PR 帶進來的每一個 commit。push 到 main 時無法可靠比對：
    # squash／merge 落地到 main 的那個 commit 是 GitHub 合成出來的，即使
    # 原始 PR 裡每個 commit 都簽署過，落地 commit 本身也未必帶
    # `Signed-off-by`——重新對它做這項檢查只會製造與貢獻是否合規無關的
    # 假失敗。
    # 因此 push 事件下這個 job 直接不執行（GitHub 視為成功，不會擋 push）；
    # 真正的把關發生在 merge 之前的 pull_request 檢查上。
    if: github.event_name == 'pull_request'
    steps:
      - name: 取得完整 commit 歷史
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 檢查這個 PR 帶進來的每個 commit 都有 Signed-off-by
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          echo "檢查範圍：${base}..${head}"

          # 一定要先收進變數再判斷：`for x in $(cmd)` 這種寫法裡，bash 會
          # 丟棄命令替換的退出碼，`set -e` 完全抓不到——base／head 任一個
          # SHA 因為 force-push／rebase 而不存在時，`git rev-list` 會失敗、
          # 印一行 fatal 到 stderr，但迴圈仍會照跑零次、腳本正常退出 0，
          # 亮出一個什麼都沒檢查過的綠燈。改成先賦值給變數，`set -e` 才會
          # 在指令替換失敗時如預期中止腳本。
          shas="$(git rev-list --no-merges "${base}..${head}")"

          # 上面那行躲得掉「指令失敗」，躲不掉「指令成功但解析出零個
          # commit」（例如這個範圍合法地全是 merge commit，被 --no-merges
          # 濾光）。零個 commit 代表這個 job 什麼都沒檢查到，必須視為失敗，
          # 而不是預設通過。
          if [ -z "$shas" ]; then
            echo "::error::DCO 檢查未取得任何 commit（範圍 ${base}..${head}）"
            exit 1
          fi

          # 刻意不寫成 `git log … | grep -q`：`set -o pipefail` 之下，訊息大於
          # 管線緩衝區（預設 64 KB）時 grep 會在比對成功後立刻結束，git 收到
          # SIGPIPE 而以 141 退出，pipefail 讓整個 pipeline 的退出碼變成 141，
          # 於是一個**確實簽署過**的 commit 會被判定為未簽署，擋掉合法的貢獻。
          # 本機用 20 萬字元的訊息實測重現過。改成先取訊息、再用 here-string
          # 比對，沒有上游行程可以被 SIGPIPE 打斷。
          missing=0
          for sha in $shas; do
            message="$(git log -1 --format=%B "$sha")"
            if ! grep -qi '^Signed-off-by: ' <<<"$message"; then
              echo "::error::commit ${sha} 缺少 Signed-off-by（違反 DCO）"
              missing=1
            fi
          done

          if [ "$missing" -eq 1 ]; then
            echo "有 commit 缺少 Signed-off-by。"
            echo "請用 'git commit -s --amend' 補簽最後一個 commit，"
            echo "或 'git rebase --signoff ${base}' 補簽整段 PR 歷史後再推送。"
            exit 1
          fi

          echo "所有 commit 都已簽署 DCO。"

  # 整個計劃唯一能證明前面十一個任務真的有用的 job：對一台真的 Odoo 17 CE
  # 跑完 scan → map → load → verify 四段管線（tests/integration/
  # test_odoo_roundtrip.py 的四條測試），確認產物真的能匯入 Odoo，而不只是
  # 通過單元測試。
  #
  # 用 `docker run` 而不是 `services:`：`services:` 起容器的時機比
  # `steps:` 早，且沒有機會在啟動時傳 `-i base,account,sale,product` 這種
  # 只有 Odoo 自己的 entrypoint 認得的初始化參數（`services:` 只能設
  # image／env／ports，換不了 command）。
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v7

      - name: 安裝 uv（含快取）
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: 安裝開發環境
        run: uv sync --locked

      - name: 產生 corpus 的 data.sqlite（demo-full 依賴它，見 Makefile）
        run: make corpus

      # PostgreSQL：`postgres:16`（Odoo 17 官方 docker-compose 範例的搭配）。
      # POSTGRES_USER=odoo 這個使用者是 initdb 的 bootstrap 使用者，
      # 天生就有 CREATEDB 權限——Odoo 用 `-d migrai -i ...` 初始化時會
      # 自己建資料庫，這裡不需要另外跑一次 `createdb`。
      #
      # Odoo：官方 image 是 `odoo`（`library/odoo`），tag `17.0`
      # （PRE-FLIGHT 1：Docker Hub API 實查，`17` 與 `17.0` 都存在，這裡
      # 用更明確的 `17.0`）。連線參數透過環境變數傳
      # （`HOST`／`USER`／`PASSWORD`，PRE-FLIGHT 2：
      # `odoo/docker` 官方 entrypoint.sh 的 `wait-for-psql.py` 會自己等
      # Postgres ready，這裡不需要另外等 Postgres）。
      #
      # `-i base,account,sale,product`：`account` 一定要裝——
      # `res.partner.credit_limit` 是它加到 `res.partner` 上的欄位，
      # case03 的 cust_mast.cust_credit 會映射到那個欄位。
      # `--without-demo=all`：demo 資料會拖慢初始化，也會讓人誤以為
      # Odoo 裡的資料是我們寫進去的。
      #
      # admin 帳密固定是 `admin`／`admin`（PRE-FLIGHT 4：
      # `odoo/addons/base/data/res_users_data.xml`），`-i` 跑完之後
      # 不需要另外呼叫 `exp_create_database` 或設密碼。
      - name: 啟動 PostgreSQL 與 Odoo 17 CE
        run: |
          docker network create migrai-net

          docker run -d --name migrai-pg --network migrai-net \
            -e POSTGRES_USER=odoo \
            -e POSTGRES_PASSWORD=odoo \
            -e POSTGRES_DB=postgres \
            postgres:16

          docker run -d --name migrai-odoo --network migrai-net \
            -p 8069:8069 \
            -e HOST=migrai-pg \
            -e USER=odoo \
            -e PASSWORD=odoo \
            odoo:17.0 \
            -d migrai -i base,account,sale,product --without-demo=all

      # 🔴 絕不用固定的 `sleep 30`——那會在慢的 runner 上隨機失敗，而失敗
      # 原因看起來會像我們的程式碼有問題（任務書明文禁止）。改用有上限的
      # 輪詢迴圈，條件是 `/jsonrpc` 的 `common.version` 回得出東西——
      # 這個方法本身不需要認證（`odoo/service/common.py` 的
      # `exp_version`），而且順便驗證了 `OdooClient._endpoint()` 的
      # `/jsonrpc` 路由假設是對的。
      - name: 等待 Odoo ready（輪詢 /jsonrpc 的 common.version）
        run: |
          for i in $(seq 1 60); do
            if curl -sf -X POST -H 'Content-Type: application/json' \
                 -d '{"jsonrpc":"2.0","method":"call","params":{"service":"common","method":"version","args":[]},"id":null}' \
                 http://localhost:8069/jsonrpc > /dev/null; then
              echo "Odoo ready（第 $i 次輪詢）"
              exit 0
            fi
            sleep 2
          done
          echo "Odoo 在 120 秒內沒有 ready"
          echo "---- migrai-odoo 容器記錄 ----"
          docker logs migrai-odoo || true
          exit 1

      # 密碼走環境變數，不進 argv（P3-2）；`tests/integration/
      # test_odoo_roundtrip.py` 的 `odoo_conn` fixture 讀
      # `MIGRAI_ODOO_URL`／`MIGRAI_ODOO_DB`／`MIGRAI_ODOO_USER`，
      # `migrai load`／`migrai verify` 本身讀 `MIGRAI_ODOO_PASSWORD`
      # （P3-2 既有契約，不是這個 job 新發明的）。
      - name: 跑整合測試（四條，缺一不可）
        env:
          MIGRAI_ODOO_URL: http://localhost:8069
          MIGRAI_ODOO_DB: migrai
          MIGRAI_ODOO_USER: admin
          MIGRAI_ODOO_PASSWORD: admin
        run: uv run pytest -v -m integration tests/integration

      - name: 印出容器記錄（失敗時協助除錯）
        if: failure()
        run: |
          echo "---- migrai-odoo ----"
          docker logs migrai-odoo || true
          echo "---- migrai-pg ----"
          docker logs migrai-pg || true
